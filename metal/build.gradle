plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = '0.3.0-alpha.5'
base { archivesName = 'SiliconShaders' }

// Share the verified archive reader/compiler with the standalone probe. Minecraft supplies LWJGL and Gson.
sourceSets.main.java {
    srcDir rootProject.file('packprobe/src/main/java')
    exclude 'siliconshaders/packprobe/PackProbe.java'
    exclude 'siliconshaders/packprobe/SceneProbe.java'
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	// Our mesher's FRAPI path (siliconshaders.metal.own.OwnFrapi, loaded only when Fabric API's renderer API is): compile only, never bundled.
	compileOnly "net.fabricmc.fabric-api:fabric-renderer-api-v1:17.0.15+79385d0b5d"
	compileOnly "net.fabricmc.fabric-api:fabric-api-base:2.0.6+fcdff87f5d"
}

def nativeOut = layout.buildDirectory.dir('natives/natives')

tasks.register('compileNative', Exec) {
	def sources = ['mcmetal.m', 'mclod.m', 'lodseam.m', 'lodmesh.c', 'lodnoise.c', 'rec.m', 'mcown.m', 'mccap.m', 'mcshaderpack.m'].collect { file("src/main/native/$it") }
	def output = nativeOut.get().file('libsiliconshaders.dylib').asFile
	inputs.files sources, file('src/main/native/mcmetal.h'), file('src/main/native/lodmesh.h'), file('src/main/native/mcsun.inc'), file('src/main/native/mcsun_geometry.h'), file('src/main/native/mcsun_surface.h'), file('src/main/native/mcsun_surface.inc'), file('src/main/native/mcsun_receivers.inc'), file('src/main/native/mcsun_temporal.inc'), file('src/main/native/mcsun_glass.inc'), file('src/main/native/mcsun_far.inc'), file('src/main/native/mcsun_gbuffer.inc'), file('src/main/native/mcwater.inc'), file('src/main/native/mcsurface_reflection.inc'), file('src/main/native/mccamera.inc'), file('src/main/native/mcssao.inc'), file('src/main/native/mcupscale.inc'), file('src/main/native/mcsun_tuning.inc'), file('src/main/native/mcblocklight.inc'), file('src/main/native/mcaurora_noise.h'), file('src/main/native/mcsun_entities.inc')
	outputs.file output
	doFirst { output.parentFile.mkdirs() }
	commandLine(['clang', '-fno-objc-arc', '-O2', '-Wall', '-arch', 'arm64', '-mmacosx-version-min=15.0', '-dynamiclib', '-install_name', '@rpath/libsiliconshaders.dylib',
		'-framework', 'CoreGraphics', '-framework', 'CoreVideo', '-framework', 'Foundation', '-framework', 'Metal', '-framework', 'MetalFX', '-framework', 'QuartzCore', '-framework', 'ImageIO', '-o', output] + sources)
}

processResources {
	dependsOn 'compileNative'
	from(layout.buildDirectory.dir('natives'))
	inputs.property 'version', version
	filesMatching('fabric.mod.json') { expand 'version': version }
}

// Double-clicking the jar (java -jar) explains that it's a Fabric mod and how to install it.
jar {
	manifest { attributes 'Main-Class': 'siliconshaders.metal.InstallHelp', 'Implementation-Version': version }
	// Apache-2.0 asks for LICENSE and NOTICE in every copy.
	from(rootProject.file('LICENSE'))
	from(rootProject.file('NOTICE'))
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// the far terrain's Vector API noise control (LodNoiseVector, opt-in -Dsiliconshaders.lod.nativeNoise=vector): loaded only when the game runs with
	// --add-modules jdk.incubator.vector
	if (it.name == 'compileJava') it.options.compilerArgs += ['--add-modules', 'jdk.incubator.vector']
}

loom.runs.client {
    runDir 'run'
    vmArgs '--enable-native-access=ALL-UNNAMED'
    programArgs '--username', 'SiliconTest', '--width', '1280', '--height', '800'
}

tasks.register('shaderChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'siliconshaders.metal.pack.ShaderChecks'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (project.hasProperty('shaderTestPack')) args project.property('shaderTestPack'), project.property('shaderTestOutput')
}
tasks.named('test') { failOnNoDiscoveredTests = false }
check.dependsOn shaderChecks

