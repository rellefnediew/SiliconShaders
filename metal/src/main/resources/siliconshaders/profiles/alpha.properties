# The alpha profile: vanilla perf only, the default when neither -Dsiliconshaders.profile nor config/siliconshaders.properties names a
# profile (profile=none turns it off). Far terrain (siliconshaders.lod) is NOT set: it stays an experimental opt-in.
# Thread QoS is the mod's default: not set here. A flag on the command line or in config/siliconshaders.properties wins.
# On the small tier (GPU under 10 cores, or 8 GB of RAM or less, or either unreadable) Profile leaves out the keys
# listed in Profile.SMALL_OUT (the 4096-entry section-clone cache and its cleanup: memory).

# Chunk pipeline: skip byte-identical region writes; mesher fast paths incl. biome blend (exact)
siliconshaders.chunk.saveSkip=true
siliconshaders.chunk.mesh=all,biome
# Sodium section-clone cache of 4096 with expired-entry cleanup (cleanup required next to clones=4096)
siliconshaders.chunk.clones=4096
siliconshaders.chunk.clonesCleanup=true
# Render-list walk with a region cache; cull recovery
siliconshaders.cpu.lists=true
siliconshaders.cpu.cullRecover=true
# Startup: narrator created lazily
siliconshaders.startup.narrator=lazy
# Texel buffer views cached over the same memory (exact, 0 px); entity model compile reuse (exact by construction)
# (both tiers)
siliconshaders.cpu.texelCache=true
siliconshaders.cpu.model=true
# The fence after a submit names that submit: no mid-frame GPU wait on the render thread (exact, 0 px) (both tiers)
siliconshaders.cpu.fence=true
# Server-side switches (soak-tested, 0 issues): POI search as loops, chunk ticking without per-pick
# overhead, the section index offset computed once (all exact). chunk.light stays opt-in: it overlaps
# alloc.lightMap, and with alloc.lightMap on it switches itself off.
siliconshaders.chunk.poi=true
siliconshaders.chunk.ticks=true
siliconshaders.chunk.chunkGet=true
# Light engine publishes a read-only snapshot of its section map instead of a copy per update
siliconshaders.alloc.lightMap=true
# Edge cap: fps capped at 2x refresh while the integrated server generates within RD+32 chunks, so the render-distance edge
# isn't left missing in new terrain (both tiers)
siliconshaders.edgeCap=true
# Adaptive frame pacing (both tiers): laptop 117-119 distinct frames/s vs 72-93,
# p50/p99 lower, fps per GHz flat; Neo fps and lows equal or up; mini inert
siliconshaders.metal.paceAdapt=true

# Far terrain's settings, inert unless far terrain is turned on (siliconshaders.lod=true in config/siliconshaders.properties): every far-terrain
# mixin applies only with siliconshaders.lod. The far set: the plain mesh with the full cull (lists and the
# real-terrain occluder stay opt-in), the seamless set, NEON noise with the yield policy. maskSpread is on by default.
siliconshaders.lod.render=mesh
siliconshaders.lod.fade=instant
siliconshaders.lod.handoff=drawn
siliconshaders.lod.prio=screen
siliconshaders.lod.publish=gpu
siliconshaders.lod.nativeNoise=neon
siliconshaders.lod.yield=missing:0
# Hand-off: far terrain's depth pushed back so real terrain wins coplanar tops. maskSpread is
# on by default under handoff=drawn again, so it isn't set here.
siliconshaders.lod.handoffPush=0.9995
